
# Despliega el gateway, la API de sesion y Valkey.
# Valkey conserva sus datos en un volumen y utiliza AOF everysec.

services:
  gateway:
    build:
      context: ./servicios/gateway
      dockerfile: dockerfile
    environment:
      REGISTRO_URL: http://registro:8000
      SESION_URL: http://sesion:8000
      HISTORIAL_URL: http://historial:8003
      ANALITICA_URL: http://analitica:8004
    ports:
      - "8000:8000"
    depends_on:
      - registro
    networks:
      - backend
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - valkey_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  sesion:
    build:
      context: ./servicios/sesion
      dockerfile: dockerfile
    environment:
      VALKEY_URL: valkey://valkey:6379/0
    depends_on:
      valkey:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

volumes:
  valkey_data: