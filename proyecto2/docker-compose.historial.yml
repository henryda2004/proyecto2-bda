services:
  historial:
    build:
      context: ./servicios/historial
    container_name: historial
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8003"
    environment:
      HISTORIAL_DB: /data/historial.db
      DATA_LAKE: /datalake/eventos
      BATCH_SIZE: 1000
      FLUSH_BATCH_SIZE: 10000
    volumes:
      - historial_data:/data
      - ./datalake/eventos:/datalake/eventos
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8003/salud')"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  historial_data:
